<!DOCTYPE html>
<html lang="pt-BR">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="{% static 'projectus/css/style.css' %}">
    <title>{{ tag_title | default:'ProjectUs' }}</title>
</head>

<body>

    <div id="container">

        <header>
            <a href="{% url 'home' %}">
             <h1>ProjectUs</h1>
            </a>
        </header>

        <nav>
          <ul>
            <li><a href="{% url 'home' %}">Início</a></li>
       
            {% if user.is_authenticated %}

          Olá,<a href=" {% url 'profile' %}" title="Ver/editar perfil de {{ user.username}}">{{ user.username }}</a>!
            <form method="POST" action="{% url 'logout' %}" style="display: inline;">
                {% csrf_token %}
               <li> <button type="submit">Sair</button></li>
            </form>
            {% else %}
            <li><a href="{% url 'login' %}">Entrar</a></li>
            {% endif %}

         </ul>
        </nav>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer>
            <div>&copy; 2026 {{ site_name }}</div>
        </footer>

    </div>

</body>

</html>
